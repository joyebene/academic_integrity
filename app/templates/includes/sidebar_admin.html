<!-- templates/includes/sidebar_admin.html -->


{% set current = request.endpoint %}


<aside class="w-64 bg-white shadow min-h-screen relative overflow-y-auto h-screen">



    <!-- Mobile Close Button -->

    <div class="md:hidden flex justify-end p-4">

        <button onclick="closeSidebar()" class="text-gray-500 hover:text-red-600 text-xl">

            <i class="fas fa-times"></i>

        </button>

    </div>




    <div class="p-6 space-y-2">





        <!-- Dashboard -->

        <a href="{{ url_for('admin.dashboard') }}" class="sidebar-link
        {% if current == 'admin.dashboard' %}
            active
        {% endif %}">


            <i class="fas fa-home"></i>

            Dashboard


        </a>



        <!-- Students -->

        <a href="{{ url_for('admin.students') }}" class="sidebar-link
        {% if current == 'admin.students' %}
            active
        {% endif %}">


            <i class="fas fa-user-graduate"></i>

            Students

        </a>

        <a href="{{ url_for('admin.lecturers') }}" class="sidebar-link {% if current == 'admin.lecturers' %}
            active
        {% endif %}">

            <i class="fas fa-chalkboard-teacher"></i>

            Lecturers

        </a>


        <!-- Courses -->

        <a href="{{ url_for('admin.courses') }}" class="sidebar-link
        {% if current == 'admin.courses' %}
            active
        {% endif %}">


            <i class="fas fa-book"></i>

            Courses


        </a>





        <!-- Assignments -->

        <a href="{{ url_for('admin.assignments') }}" class="sidebar-link
        {% if current == 'admin.assignments' %}
            active
        {% endif %}">


            <i class="fas fa-file-alt"></i>

            Assignments


        </a>





        <!-- Submissions -->

        <a href="{{ url_for('admin.submissions') }}" class="sidebar-link
        {% if current == 'admin.submissions' %}
            active
        {% endif %}">


            <i class="fas fa-folder-open"></i>

            Submissions


        </a>




        <!-- Notifications -->

        <a href="{{ url_for('notifications.index') }}" class="sidebar-link
        {% if current == 'notifications.index' %}
            active
        {% endif %}">


            <i class="fas fa-bell"></i>

            Notifications


        </a>

        <!-- Reports -->

        <a href="{{ url_for('reports.index') }}" class="sidebar-link
        {% if current == 'reports.index' %}
            active
        {% endif %}">

            <i class="fas fa-chart-bar"></i>

            Reports

        </a>


        <!-- Settings -->

        <a href="{{ url_for('settings.index') }}" class="sidebar-link
        {% if current == 'settings.index' %}
            active
        {% endif %}">


            <i class="fas fa-cog"></i>

            System Settings


        </a>





    </div>



</aside>
